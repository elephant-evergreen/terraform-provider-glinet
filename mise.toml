[tools]
go = "1.27.4"
terraform = "1.17.2"

[tasks.check]
description = "Check formatting, modules, tests, build, and generated documentation"
run = [
  'test -z "$(gofmt -l main.go internal)"',
  "go mod verify",
  "go vet ./...",
  'TF_ACC_TERRAFORM_PATH="$(command -v terraform)" go test -race -p 2 ./...',
  "go test -tags acceptance -run '^$' ./...",
  "go build -o /dev/null .",
  "terraform fmt -check -recursive examples",
  "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...",
  "go tool tfplugindocs generate --provider-name glinet",
  "git diff --exit-code -- docs",
]

[tasks.fuzz]
description = "Run each fuzz target for a short session"
run = '''
fuzztime="${FUZZTIME:-30s}"
go test ./internal/router -run '^FuzzShellQuote$' -fuzz '^FuzzShellQuote$' -fuzztime "$fuzztime"
go test ./internal/router -run '^FuzzLuaQuote$' -fuzz '^FuzzLuaQuote$' -fuzztime "$fuzztime"
go test ./internal/router -run '^FuzzSectionValidation$' -fuzz '^FuzzSectionValidation$' -fuzztime "$fuzztime"
go test ./internal/router -run '^FuzzValidOption$' -fuzz '^FuzzValidOption$' -fuzztime "$fuzztime"
go test ./internal/router -run '^FuzzMergeManagedConfiguration$' -fuzz '^FuzzMergeManagedConfiguration$' -fuzztime "$fuzztime"
go test ./internal/router -run '^FuzzParseSafetyState$' -fuzz '^FuzzParseSafetyState$' -fuzztime "$fuzztime"
go test ./internal/router -run '^FuzzParseConfigurationState$' -fuzz '^FuzzParseConfigurationState$' -fuzztime "$fuzztime"
go test ./internal/router -run '^FuzzSectionMatches$' -fuzz '^FuzzSectionMatches$' -fuzztime "$fuzztime"
go test ./internal/provider -run '^FuzzFirewallRuleRoundTrip$' -fuzz '^FuzzFirewallRuleRoundTrip$' -fuzztime "$fuzztime"
go test ./internal/provider -run '^FuzzReconcileFirewallRules$' -fuzz '^FuzzReconcileFirewallRules$' -fuzztime "$fuzztime"
'''

[tasks.acceptance]
description = "Run the hardware acceptance suite against a dedicated router"
run = '''
test "${GLINET_ACCEPTANCE:-}" = 1 || { echo "Set GLINET_ACCEPTANCE=1 and the GLINET_* connection variables. See docs/testing.md." >&2; exit 2; }
TF_ACC=1 go test -tags acceptance -run '^TestAcceptanceHardware$' -count=1 -v -timeout 30m ./internal/provider
'''

[tasks.bench]
description = "Run the provider benchmarks"
run = "go test -run '^$' -bench . -benchmem ./..."
