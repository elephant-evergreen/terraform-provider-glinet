[tools]
go = "1.27.3"
terraform = "1.17.1"

[tasks.check]
run = """
export TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
test -z "$(gofmt -l main.go internal)"
go mod verify
go vet ./...
go test -race -p 2 ./...
go build -o /dev/null .
terraform fmt -check -recursive examples
"""

[tasks.docs]
run = """
go tool tfplugindocs generate --provider-name glinet
"""
