name: Fuzz (pull request)

on:
  pull_request:
    paths:
      - "internal/router/**"
      - "internal/provider/**"
      - "mise.toml"
      - ".github/workflows/fuzz-pr.yml"

permissions:
  contents: read

concurrency:
  group: fuzz-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.11.12
      - run: mise run fuzz
        env:
          FUZZTIME: 15s
