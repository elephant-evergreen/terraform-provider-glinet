name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.14
      - run: mise run check

  robustness:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.14
      - name: Run robustness checks
        run: mise run fuzz
        env:
          FUZZTIME: 15s

  packages:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.14
      - name: Verify release packages
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.3
          args: release --snapshot --clean --skip=publish,sign --parallelism 2

  actions-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.5.1
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
